apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
        listen 8080;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = / {
            default_type text/plain;
            return 200 {{ printf "%s\n" .Values.message | quote }};
        }
    }
