apiVersion: v1
kind: Pod
metadata:
  name: {{ include "webapp.fullname" . }}-test
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: check
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          set -e
          body="$(wget -qO- -T 5 http://{{ include "webapp.fullname" . }}:{{ .Values.service.port }}/)"
          test "$body" = {{ .Values.message | quote }}
